plugins {
    id 'com.android.application'
    id 'jacoco'
}

android {
    namespace 'com.matter.tv.server'
    compileSdk 34

    defaultConfig {
        applicationId "com.matter.tv.server"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                targets "default"
            }
        }
    }

    buildTypes {
        debug {
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        debug {
            packagingOptions{
                doNotStrip "**/*.so"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['../app/libs/jniLibs']
            java.srcDirs = [
                    'src/main/java',
                    '../common-api/src/main/java',
            ]
            aidl.srcDirs = ['../common-api/src/main/aidl']

            // uncomment this code to debug
//            java.srcDirs = [
//                    'src/main/java',
//                    '../common-api/src/main/java',
//                    '../../third_party/connectedhomeip/src/setup_payload/java/src',
//                    '../../third_party/connectedhomeip/src/platform/android/java',
//                    '../../third_party/connectedhomeip/src/app/server/java/src/',
//                    '../../java/src',
//            ]
        }
    }
    buildFeatures {
        viewBinding = true
        aidl = true
    }
}

dependencies {
    implementation fileTree(dir: "../app/libs", include: ["*.jar","*.so"])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation 'com.google.zxing:core:3.5.2'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
}
configurations { jacocoAnt }
dependencies {
    jacocoAnt 'org.jacoco:org.jacoco.ant:0.8.11'
    if (System.getenv("CIRQUE_COVERAGE") == "1") {
        implementation 'org.jacoco:org.jacoco.agent:0.8.11:runtime'
    }
}

if (System.getenv("CIRQUE_COVERAGE") == "1") {
    android.sourceSets.debug.resources.srcDir("$buildDir/generated/jacoco_res")
    afterEvaluate {
        def generateJacocoProps = tasks.register("generateJacocoProperties") {
            def resDir = new File("$buildDir/generated/jacoco_res")
            outputs.dir(resDir)
            doLast {
                resDir.mkdirs()
                new File(resDir, "jacoco-agent.properties").text = "output=none\n"
            }
        }
        if (tasks.findByName('processDebugJavaRes')) {
            tasks.named('processDebugJavaRes').configure { dependsOn generateJacocoProps }
        }


        if (tasks.findByName('compileDebugJavaWithJavac')) {
            tasks.named('compileDebugJavaWithJavac').configure {
                inputs.property("cirqueCoverage", "1")
                outputs.upToDateWhen { false }
                def jacocoAntPath = configurations.jacocoAnt.asPath
                def buildDirStr = buildDir.absolutePath
                doLast {
                    ant.taskdef(name: 'jacocoInstrument', classname: 'org.jacoco.ant.InstrumentTask', classpath: jacocoAntPath)
                    def rawStageDir = new File("$buildDirStr/instrumented/classes_raw")
                    rawStageDir.deleteDir()
                    rawStageDir.mkdirs()
                    def destDir = new File("$buildDirStr/instrumented/classes")
                    destDir.deleteDir()
                    destDir.mkdirs()
                    def classesDir = destinationDirectory.get().asFile
                    if (classesDir.exists()) {
                        ant.copy(todir: rawStageDir.absolutePath, overwrite: true) {
                            fileset(dir: classesDir.absolutePath, excludes: "**/Cluster*Mapping*.class,**/CoverageReceiver*.class,**/*Companion*.class,**/CHIPToolActivity*.class")
                        }
                        rawStageDir.eachFileRecurse { f ->
                            if (f.isFile() && f.name.endsWith(".class")) {
                                if (new String(f.bytes, 'ISO-8859-1').contains('$jacocoData')) {
                                    f.delete()
                                }
                            }
                        }
                        ant.jacocoInstrument(destdir: destDir.absolutePath) {
                            fileset(dir: rawStageDir.absolutePath)
                        }
                        ant.copy(todir: classesDir.absolutePath, overwrite: true, preservelastmodified: false) {
                            fileset(dir: destDir.absolutePath)
                        }
                    }
                }
            }
        }
        if (tasks.findByName('compileDebugKotlin')) {
            tasks.named('compileDebugKotlin').configure {
                inputs.property("cirqueCoverage", "1")
                outputs.upToDateWhen { false }
                def jacocoAntPath = configurations.jacocoAnt.asPath
                def buildDirStr = buildDir.absolutePath
                doLast {
                    ant.taskdef(name: 'jacocoInstrument', classname: 'org.jacoco.ant.InstrumentTask', classpath: jacocoAntPath)
                    def rawStageDir = new File("$buildDirStr/instrumented/kotlin_raw")
                    rawStageDir.deleteDir()
                    rawStageDir.mkdirs()
                    def destDir = new File("$buildDirStr/instrumented/kotlin")
                    destDir.deleteDir()
                    destDir.mkdirs()
                    def classesDir = destinationDirectory.get().asFile
                    if (classesDir.exists()) {
                        ant.copy(todir: rawStageDir.absolutePath, overwrite: true) {
                            fileset(dir: classesDir.absolutePath, excludes: "**/Cluster*Mapping*.class,**/CoverageReceiver*.class,**/*Companion*.class,**/CHIPToolActivity*.class")
                        }
                        rawStageDir.eachFileRecurse { f ->
                            if (f.isFile() && f.name.endsWith(".class")) {
                                if (new String(f.bytes, 'ISO-8859-1').contains('$jacocoData')) {
                                    f.delete()
                                }
                            }
                        }
                        ant.jacocoInstrument(destdir: destDir.absolutePath) {
                            fileset(dir: rawStageDir.absolutePath)
                        }
                        ant.copy(todir: classesDir.absolutePath, overwrite: true, preservelastmodified: false) {
                            fileset(dir: destDir.absolutePath)
                        }
                    }
                }
            }
        }
    }
}
