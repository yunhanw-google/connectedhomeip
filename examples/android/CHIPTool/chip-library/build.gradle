plugins {
    id 'com.android.library'
    id 'kotlin-android'
}

apply from: "../../../../third_party/android_deps/android_deps.gradle"

android {
    namespace 'com.google.chip.chiplib'
    compileSdkVersion 34

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"

        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main {
            java.srcDirs = [
                    '../../../../src/setup_payload/java/src',
                    '../../../../src/controller/java/zap-generated',
                    '../../../../src/controller/java/generated/java',
                    '../../../../src/controller/java/src',
                    '../../../../src/platform/android/java'
            ]
            // Exclude files with mismatched class names or missing test dependencies
            java.exclude 'chip/devicecontroller/BatchInvokeCallbackJni.java'
            java.exclude 'chip/devicecontroller/BatchInvokeCallback.java'
            java.exclude 'chip/devicecontroller/GetConnectedDeviceCallbackForTestJni.java'
            
            kotlin.srcDirs = java.srcDirs
        }
    }
    packagingOptions {
        jniLibs.useLegacyPackaging = true
    }
}

dependencies {
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.4'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    // Dependencies for CHIP Java code are defined centrally in
    // android_deps.gradle. Copy deps from that file into our implementation
    // config, instead of maintaining two separate lists of dependencies.
    configurations.chipDeps.dependencies.each {
        project.dependencies.add("implementation", "${it.group}:${it.name}:${it.version}")
    }
}
