name: Cirque

on:
    push:
        branches:
            - master
            - 'v*-branch'
    workflow_dispatch:

concurrency:
    group: ${{ github.ref }}-${{ github.workflow }}-${{ (github.event_name == 'pull_request' && github.event.number) || (github.event_name == 'workflow_dispatch' && github.run_number) || github.sha }}
    cancel-in-progress: true

env:
    CHIP_LOG_TIMESTAMPS: false

jobs:
    build_android_chiptool:
        name: Build Android x64 CHIPTool

        runs-on: ubuntu-latest
        if: github.actor != 'restyled-io[bot]'
        timeout-minutes: 90

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Maximize runner disk
              uses: ./.github/actions/maximize-runner-disk
            - name: Checkout submodules
              uses: ./.github/actions/checkout-submodules
              with:
                platform: android
            - name: Bootstrap Cache
              uses: ./.github/actions/bootstrap-cache
            - name: Bootstrap Android
              run: |
                  integrations/docker/images/stage-3/chip-build-android/run.sh \
                    --env CIRQUE_COVERAGE=1 \
                    -- sh -c " \
                       git config --global --add safe.directory '*' \
                       && bash scripts/bootstrap.sh -p all,android \
                       && chown -R $(id -u):$(id -g) .environment \
                    "
            - name: Android Build Cache
              id: android-build-cache
              uses: actions/cache@v4
              with:
                path: |
                  .ccache
                  .gradle-cache
                key: cirque-android-build-cache-${{ runner.os }}-${{ hashFiles('build_overrides/**', 'third_party/android_deps/**', 'examples/android/CHIPTool/**') }}
                restore-keys: cirque-android-build-cache-${{ runner.os }}-
            - name: Build Android x64 CHIPTool APK
              run: |
                  integrations/docker/images/stage-3/chip-build-android/run.sh \
                    --env CIRQUE_COVERAGE=1 \
                    -- sh -c " \
                       git config --global --add safe.directory '*' \
                       && export CCACHE_DIR=\"\$PWD/.ccache\" \
                       && export CCACHE_MAXSIZE=\"2G\" \
                       && export CCACHE_COMPILERCHECK=\"content\" \
                       && export CCACHE_SLOPPINESS=\"include_file_mtime,time_macros\" \
                       && export GRADLE_USER_HOME=\"\$PWD/.gradle-cache\" \
                       && mkdir -p \"\$CCACHE_DIR\" \"\$GRADLE_USER_HOME\" \
                       && if command -v ccache >/dev/null 2>&1; then \
                            ./scripts/run_in_build_env.sh './scripts/build/build_examples.py --pw-command-launcher=ccache --target android-x64-chip-tool build'; \
                          else \
                            ./scripts/run_in_build_env.sh './scripts/build/build_examples.py --target android-x64-chip-tool build'; \
                          fi \
                       && (ccache --show-stats || true) \
                       && chown -R $(id -u):$(id -g) .ccache .gradle-cache out examples/android/CHIPTool \
                      "
            - name: Save Android Build Cache
              if: ${{ always() && !env.ACT && steps.android-build-cache.outputs.cache-hit != 'true' }}
              continue-on-error: true
              uses: actions/cache/save@v4
              with:
                path: |
                  .ccache
                  .gradle-cache
                key: cirque-android-build-cache-${{ runner.os }}-${{ hashFiles('build_overrides/**', 'third_party/android_deps/**', 'examples/android/CHIPTool/**') }}
            - name: Upload Android x64 CHIPTool APK
              if: ${{ !env.ACT }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: cirque-android-x64-chip-tool-apk
                  path: |
                      out/android-x64-chip-tool/outputs/apk/debug/app-debug.apk
                      out/android-x64-chip-tool/intermediates/javac/debug/classes/
                      out/android-x64-chip-tool/tmp/kotlin-classes/debug/
                      out/android-x64-chip-tool/lib/jni/x86_64/libCHIPController.so
                  retention-days: 1
                  if-no-files-found: error
                  overwrite: true

