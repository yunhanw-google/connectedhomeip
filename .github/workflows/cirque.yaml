    build_silabs_arm32:
        name: Build ARM32 Silabs Lighting App

        runs-on: ubuntu-latest
        if: github.actor != 'restyled-io[bot]'
        timeout-minutes: 90

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Maximize runner disk
              uses: ./.github/actions/maximize-runner-disk
            - name: Checkout submodules
              uses: ./.github/actions/checkout-submodules
              with:
                platform: linux
            - name: Bootstrap Cache
              uses: ./.github/actions/bootstrap-cache
            - name: Bootstrap
              run: |
                  integrations/docker/images/stage-2/chip-build-cirque/run.sh \
                    -- sh -c " \
                       git config --global --add safe.directory '*' \
                       && bash scripts/bootstrap.sh \
                       && chown -R $(id -u):$(id -g) .environment \
                    "
            - name: ARM32 Silabs Build Cache
              id: silabs-arm32-build-cache
              uses: actions/cache/restore@v4
              with:
                path: .ccache
                key: cirque-silabs-arm32-build-cache-${{ runner.os }}-${{ hashFiles('scripts/build/gn_gen_cirque_silabs_arm32.sh', 'build_overrides/**', 'examples/lighting-app/silabs/**') }}-${{ github.run_id }}
                restore-keys: |
                  cirque-silabs-arm32-build-cache-${{ runner.os }}-${{ hashFiles('scripts/build/gn_gen_cirque_silabs_arm32.sh', 'build_overrides/**', 'examples/lighting-app/silabs/**') }}-
                  cirque-silabs-arm32-build-cache-${{ runner.os }}-
            - name: Install static qemu-arm
              # Copied into CHIPEndDevice containers, so it must be static.
              run: |
                  sudo apt-get update
                  sudo apt-get install -y qemu-user-static
                  file -L /usr/bin/qemu-arm-static | grep -q static
            - name: Build ARM32 chip-silabs-lighting-app and pty_bridge_linux
              run: |
                  integrations/docker/images/stage-2/chip-build-cirque/run.sh \
                    --env CIRQUE_COVERAGE=1 \
                    -- sh -c " \
                       git config --global --add safe.directory '*' \
                       && export CCACHE_DIR=\"\$PWD/.ccache\" \
                       && mkdir -p \"\$CCACHE_DIR\" \
                       && SILABS_ARM32_APPS=lighting scripts/build/gn_gen_cirque_silabs_arm32.sh \
                       && chown -R $(id -u):$(id -g) .ccache out .environment \
                      "
                  cp -fL /usr/bin/qemu-arm-static out/host_libs/qemu-arm
                  chmod 755 out/host_libs/qemu-arm
            - name: Verify ARM32 artifacts
              run: |
                  file out/arm-silabs/chip-silabs-lighting-app | tee /dev/stderr | grep -q "ELF 32-bit LSB.*ARM"
                  file out/host_libs/pty_bridge_linux | tee /dev/stderr | grep -q "ELF 64-bit LSB.*x86-64"
                  file -L out/host_libs/qemu-arm | tee /dev/stderr | grep -q "static"
            - name: Save ARM32 Silabs Build Cache
              if: ${{ always() && !env.ACT }}
              continue-on-error: true
              uses: actions/cache/save@v4
              with:
                path: .ccache
                key: cirque-silabs-arm32-build-cache-${{ runner.os }}-${{ hashFiles('scripts/build/gn_gen_cirque_silabs_arm32.sh', 'build_overrides/**', 'examples/lighting-app/silabs/**') }}-${{ github.run_id }}
            - name: Upload ARM32 Silabs artifacts
              if: ${{ !env.ACT }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: cirque-silabs-arm32-lighting-app
                  path: |
                      out/arm-silabs/chip-silabs-lighting-app
                      out/host_libs/pty_bridge_linux
                      out/host_libs/qemu-arm
                  retention-days: 1
                  if-no-files-found: error
